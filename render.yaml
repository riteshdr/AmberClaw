services:
  - type: web
    name: amberclaw
    runtime: docker
    plan: standard
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: AMBERCLAW_DATA_DIR
        value: /data
      - key: STREAMCLIPS_HOME
        value: /data/StreamClips
      - key: STREAMCLIPS_BRAIN
        value: groq
      - key: AUTO_UPLOAD
        value: "false"
      - key: YOUTUBE_PRIVACY
        value: private
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: AMBERCLAW_BASIC_AUTH
        sync: false
    disk:
      name: amberclaw-data
      mountPath: /data
      sizeGB: 20
